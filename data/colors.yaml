# 색 사전. 옷의 color.primary / color.secondary는 이 키만 씁니다.
# neutral: 무채색·기본색 여부 (어떤 색과도 무난하게 어울림)

colors:
  black:    { label: 블랙,   neutral: true }
  white:    { label: 화이트, neutral: true }
  gray:     { label: 그레이, neutral: true }
  charcoal: { label: 차콜,   neutral: true }
  navy:     { label: 네이비, neutral: true }
  beige:    { label: 베이지, neutral: true }
  ivory:    { label: 아이보리, neutral: true }
  brown:    { label: 브라운, neutral: true }
  indigo:   { label: 인디고(데님), neutral: true }
  khaki:    { label: 카키,   neutral: false }
  olive:    { label: 올리브, neutral: false }
  blue:     { label: 블루,   neutral: false }
  skyblue:  { label: 스카이블루, neutral: false }
  green:    { label: 그린,   neutral: false }
  red:      { label: 레드,   neutral: false }
  burgundy: { label: 버건디, neutral: false }
  pink:     { label: 핑크,   neutral: false }
