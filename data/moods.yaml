# 무드 태그 사전과 무드 간 궁합.
# 브랜드 프로필과 옷의 mood_override는 이 목록의 키만 쓸 수 있습니다.
# 사용자가 주로 입는 브랜드가 정해지면 목록을 다듬습니다.

moods:
  minimal: 미니멀 (절제된 색, 깔끔한 선)
  classic: 클래식 (테일러링, 전통적인 아이템)
  contemporary: 컨템포러리 (현대적으로 다듬은 기본기)
  workwear: 워크웨어 (튼튼한 소재, 실용 디테일)
  amekaji: 아메카지 (미국 캐주얼, 빈티지 감성)
  street: 스트리트 (그래픽, 오버 실루엣)
  sporty: 스포티 (운동복에서 온 디자인)
  techwear: 테크웨어 (기능성 소재, 도시적 아웃도어)
  preppy: 프레피 (단정한 캠퍼스 룩)

# 같은 무드끼리는 항상 잘 어울리는 것으로 봅니다(점수 +).
# 아래 쌍은 순서 무관. 목록에 없는 쌍은 중립(0)입니다.
pairs:
  good:
    - [minimal, contemporary]
    - [minimal, classic]
    - [classic, preppy]
    - [classic, contemporary]
    - [workwear, amekaji]
    - [street, sporty]
    - [techwear, sporty]
    - [techwear, minimal]
  clash:
    - [techwear, classic]
    - [street, classic]
    - [sporty, classic]
    - [street, preppy]
